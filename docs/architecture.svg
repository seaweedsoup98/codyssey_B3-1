<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-label="AWS B3-1: Internet connects to Internet Gateway attached at the VPC boundary. Public Subnet contains EC2 running Nginx, with security group rules. The subnet uses a route table pointing to IGW.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#101827" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #101827; }
    .title { font-size: 34px; font-weight: 700; }
    .label { font-size: 25px; font-weight: 700; }
    .small { font-size: 22px; font-weight: 500; }
    .path { fill: none; stroke: #101827; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <rect width="1000" height="630" rx="14" fill="#ffffff"/>
  <text class="title" x="500" y="55" text-anchor="middle">B3-1  ·  AWS Web Service</text>
  <rect x="54" y="210" width="892" height="368" rx="16" fill="#ffffff" stroke="#101827" stroke-width="3"/>
  <text class="label" x="83" y="264">VPC  10.0.0.0/16</text>
  <rect x="361" y="93" width="278" height="57" rx="11" fill="#ffffff" stroke="#101827" stroke-width="2"/>
  <text class="label" x="500" y="130" text-anchor="middle">Internet</text>
  <path class="path" d="M500 150 V174"/>
  <path class="path" d="M500 242 V315"/>
  <rect x="336" y="176" width="328" height="66" rx="11" fill="#ffffff" stroke="#101827" stroke-width="3"/>
  <text class="label" x="500" y="218" text-anchor="middle">Internet Gateway</text>
  <rect x="142" y="312" width="716" height="153" rx="12" fill="#ffffff" stroke="#101827" stroke-width="2.5"/>
  <text class="label" x="169" y="351">Public Subnet  10.0.1.0/24</text>
  <rect x="318" y="373" width="364" height="54" rx="10" fill="#ffffff" stroke="#101827" stroke-width="2"/>
  <text class="label" x="500" y="409" text-anchor="middle">EC2 + Nginx</text>
  <text class="small" x="500" y="450" text-anchor="middle">SG: HTTP 80 (all)  ·  SSH 22 (my IP/32)</text>
  <path d="M500 466 V498" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5"/>
  <rect x="199" y="500" width="602" height="58" rx="10" fill="#ffffff" stroke="#101827" stroke-width="2"/>
  <text class="label" x="500" y="538" text-anchor="middle">Route Table: 0.0.0.0/0 → IGW</text>
</svg>
