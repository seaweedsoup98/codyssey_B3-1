<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="B3-1 AWS architecture. Internet Gateway attached at VPC boundary. Public subnet with EC2 and security group. Separate subnet-associated route table.">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto-start-reverse">
      <path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#2563eb" stroke-width="1.4"/>
    </marker>
  </defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #1e293b; }
    .title { font-size: 25px; font-weight: 700; }
    .section { font-size: 18px; font-weight: 700; }
    .main { font-size: 18px; font-weight: 600; }
    .detail { font-size: 15px; }
    .subtle { font-size: 13px; fill: #475569; }
    .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
    .association { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; }
  </style>
  <rect x="2" y="2" width="996" height="636" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="500" y="40" class="title" text-anchor="middle">B3-1 · AWS Web Service Architecture</text>
  <text x="500" y="63" class="subtle" text-anchor="middle">AWS Region: ap-northeast-2</text>

  <!-- External client is outside the VPC. -->
  <rect x="380" y="78" width="240" height="49" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="107" class="main" text-anchor="middle">Internet / Client</text>

  <!-- VPC's top border is y=180. The gateway straddles the boundary rather than sitting inside a subnet. -->
  <rect x="54" y="180" width="892" height="372" rx="16" fill="#f4fbf7" stroke="#16865e" stroke-width="3"/>
  <text x="83" y="222" class="section">VPC 10.0.0.0/16</text>

  <!-- Internet gateway attached at the edge of the VPC. -->
  <path d="M500 127 V143" class="flow"/>
  <rect x="346" y="143" width="308" height="76" rx="12" fill="#e9f1ff" stroke="#2563eb" stroke-width="3"/>
  <text x="500" y="172" class="main" text-anchor="middle">Internet Gateway (IGW)</text>
  <text x="500" y="199" class="detail" text-anchor="middle">Attached at VPC boundary</text>
  <path d="M500 219 V310" class="flow"/>

  <!-- Public subnet holds the instance. -->
  <rect x="130" y="272" width="740" height="174" rx="14" fill="#eaf5ff" stroke="#4384bc" stroke-width="2.5"/>
  <text x="152" y="298" class="section">Public Subnet 10.0.1.0/24</text>
  <!-- Security group acts on the instance ENI; it is not a second subnet. -->
  <rect x="206" y="314" width="588" height="116" rx="11" fill="#fff7e5" stroke="#d69b26" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="228" y="338" class="detail">Security Group · attached to EC2 network interface</text>
  <rect x="249" y="355" width="502" height="59" rx="9" fill="#ffffff" stroke="#4384bc" stroke-width="2"/>
  <text x="500" y="381" class="main" text-anchor="middle">EC2 t3.micro · Amazon Linux · Nginx</text>
  <text x="500" y="401" class="subtle" text-anchor="middle">HTTP 80 from 0.0.0.0/0 · SSH 22 from learner IP/32</text>

  <!-- Route table is a routing resource associated with subnet, not a traffic device inside subnet. -->
  <path d="M780 446 V461" class="association"/>
  <rect x="177" y="460" width="646" height="71" rx="10" fill="#ffffff" stroke="#16865e" stroke-width="2"/>
  <text x="500" y="485" class="main" text-anchor="middle">Public Route Table · associated with subnet</text>
  <text x="500" y="513" class="detail" text-anchor="middle">10.0.0.0/16 → local    |    0.0.0.0/0 → IGW</text>

  <text x="500" y="576" class="subtle" text-anchor="middle">Blue arrows: example inbound HTTP request; the response follows the reverse path.</text>
  <text x="500" y="598" class="subtle" text-anchor="middle">IAM manages AWS API permissions and is not a network traffic hop.</text>
  <text x="500" y="620" class="subtle" text-anchor="middle">Verified deployment on 2026-10-26; lab resources were subsequently deleted.</text>
</svg>
