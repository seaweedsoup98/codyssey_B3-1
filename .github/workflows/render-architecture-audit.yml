name: Render corrected architecture
on:
  push:
    paths:
      - docs/architecture.svg
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG with antialiasing
        run: |
          python3 -m venv /tmp/b3-render
          /tmp/b3-render/bin/pip install --quiet cairosvg
          /tmp/b3-render/bin/python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='docs/architecture.svg',write_to='docs/architecture.png',output_width=2000,output_height=1300)
          PY
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.png
          if ! git diff --cached --quiet; then
            git commit -m "Render completed B3-1 architecture diagram"
            git push
          fi
